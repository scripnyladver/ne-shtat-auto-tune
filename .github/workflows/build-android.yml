
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract app source
        run: unzip -q ne_shtat_auto_tune_mvp.zip -d source

      - name: Generate Android project and fetch packages
        working-directory: source/ne_shtat_auto_tune
        run: chmod +x bootstrap.sh && ./bootstrap.sh

      - name: Build APK
        working-directory: source/ne_shtat_auto_tune
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ne-shtat-auto-tune-apk
          path: source/ne_shtat_auto_tune/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
